name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urbana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/urbana_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py check

      - name: Run migrations (verifies no missing/broken migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/urbana_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py migrate --noinput

      - name: Run test suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/urbana_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py test

  # Render auto-deploys on push to `main` once its GitHub integration is
  # connected — no extra step needed here. If you turn OFF Render's
  # "auto-deploy" toggle and want this workflow to trigger it explicitly
  # instead, add a `deploy` job that curls your Render Deploy Hook URL
  # (Render dashboard -> Settings -> Deploy Hook), guarded by
  # `needs: test` and `if: github.ref == 'refs/heads/main'`.
